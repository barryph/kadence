appId: com.codecompletelabs.kadence.preview
env:
  TEST_EMAIL: ${TEST_EMAIL || "test@kadence.dev"}
  TEST_PASSWORD: ${TEST_PASSWORD || "testpassword123"}
  ACTIVITY_NAME: ${ACTIVITY_NAME || "E2E Test Run"}
---
- launchApp
- runFlow:
    when:
      visible: "Login!"
    file: subflows/login.yaml
- assertVisible: "Activities Center"
- tapOn: "Add Activity"
- assertVisible: "New Activity"
- tapOn: "Squat"
- inputText: ${ACTIVITY_NAME}
- tapOn: "TCKR"
- inputText: "E2E"
# The repeat frequency defaults to 1 and is not tapped here: its label and its
# placeholder are the same string, so a text target is ambiguous.
- tapOn: "Create"
- assertVisible: ${ACTIVITY_NAME}
