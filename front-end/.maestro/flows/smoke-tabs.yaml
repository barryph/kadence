appId: com.codecompletelabs.kadence.preview
env:
  TEST_EMAIL: ${TEST_EMAIL || "test@kadence.dev"}
  TEST_PASSWORD: ${TEST_PASSWORD || "testpassword123"}
---
# A clean launch makes this flow deterministic: it always exercises signed-out
# -> sign-in rather than depending on whatever session was left behind.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Login!"
    file: subflows/login.yaml
- assertVisible: "Activities Center"
- tapOn: "Timeline"
# The timeline's month navigation renders on every load, data or not.
- assertVisible: "←"
- tapOn: "Categories"
- assertVisible: "Create Category"
- tapOn: "Goals"
- assertVisible: "Monitor Your Frequency"
- tapOn: "Activities"
- assertVisible: "Activities Center"
