appId: com.codecompletelabs.kadence.preview
env:
  TEST_EMAIL: ${TEST_EMAIL || "test@kadence.dev"}
  TEST_PASSWORD: ${TEST_PASSWORD || "testpassword123"}
---
- assertVisible: "Login!"
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
- tapOn: "Enter"
# A fresh install opens the home guide automatically and it covers the tab bar.
# Dismiss it (the first "Close guide" match is the backdrop); no-op once seen.
- runFlow:
    when:
      visible: "Close guide"
    commands:
      - tapOn:
          text: "Close guide"
          index: 0
- assertVisible: "Activities Center"
