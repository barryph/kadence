appId: com.codecompletelabs.kadence.preview
env:
  TEST_EMAIL: ${TEST_EMAIL || "test@kadence.dev"}
  TEST_PASSWORD: ${TEST_PASSWORD || "testpassword123"}
---
- tapOn:
    id: "menu-button"
    optional: true
- tapOn:
    text: ".*[Bb]ars.*"
    optional: true
- tapOn:
    point: "90%,8%"
    optional: true
- tapOn: "Profile"
- assertVisible: "Profile"
- tapOn:
    point: "90%,8%"
    optional: true
- tapOn: "Profile"
- assertVisible: ${TEST_EMAIL}
