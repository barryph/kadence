appId: com.codecompletelabs.kadence.preview
env:
  TEST_EMAIL: ${TEST_EMAIL || "test@kadence.dev"}
  TEST_PASSWORD: ${TEST_PASSWORD || "testpassword123"}
---
# Opens the Profile screen from the tab header. The account button carries the
# accessibility label "Account", so it is addressed by label instead of by a
# screen coordinate (the old point also targeted a drawer that no longer exists,
# and a "menu-button" test id that was never rendered).
- tapOn: "Account"
- assertVisible: "Profile"
- assertVisible: ${TEST_EMAIL}
