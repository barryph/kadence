appId: com.codecompletelabs.kadence.preview
env:
  TEST_EMAIL: ${TEST_EMAIL || "test@kadence.dev"}
  TEST_PASSWORD: ${TEST_PASSWORD || "testpassword123"}
---
- launchApp
- runFlow:
    when:
      visible: "Login!"
    file: subflows/login.yaml
- tapOn: "Timeline"
# The month navigation renders on every load, with or without data. It replaces
# the old raw-coordinate taps, which hit a grid cell whose position depends on
# the signed-in user's activities.
- assertVisible: "←"
- tapOn: "←"
- tapOn: "→"
- assertVisible: "←"
